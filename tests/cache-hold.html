<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Cached list pre-render hold test</title>
    <link rel="stylesheet" href="../src/content.css">
    <script>
      globalThis.chrome = {
        storage: {
          local: {
            async get() {
              return {
                bggHardBlockerConsent: {
                  granted: true,
                  disclosureVersion: "2026-08-15"
                },
                bggHardBlockerState: {
                  schemaVersion: 3,
                  usernames: ["Muted User"],
                  avatarIds: [],
                  status: { lastSync: "2026-08-04T00:00:00.000Z" }
                }
              };
            },
            async set() {}
          }
        }
      };
    </script>
    <script src="../src/content-core.js"></script>
    <script src="../src/content.js"></script>
  </head>
  <body data-status="running">
    <gg-post id="cache-held-post">
      <article class="post">
        <header class="post-header"><a href="/profile/Allowed">Allowed</a></header>
        <div class="post-body">
          <gg-markup-quote id="cache-held-quote">
            <div class="c-header"><span class="user-attribution">Muted User<br>@Muted User</span></div>
            <gg-markup-content>Blocked content</gg-markup-content>
          </gg-markup-quote>
          <p id="cache-held-reply">Allowed reply</p>
        </div>
      </article>
    </gg-post>
    <script>
      const earlyState = {};

      setTimeout(() => {
        earlyState.quoteRemoved = !document.getElementById("cache-held-quote");
        earlyState.replyPresent = Boolean(document.getElementById("cache-held-reply"));
        earlyState.ready = document.documentElement.hasAttribute("data-bgg-hard-blocker-ready");
        earlyState.visibility = getComputedStyle(document.body).visibility;
      }, 150);

      setTimeout(() => {
        const failures = [];
        const check = (condition, message) => {
          if (!condition) failures.push(message);
        };

        check(earlyState.quoteRemoved, "cached list was not applied before render");
        check(earlyState.replyPresent, "allowed reply was removed");
        check(!earlyState.ready, "cached data revealed the page before the 500 ms ceiling");
        check(earlyState.visibility === "hidden", "pre-render hold is not hiding the page");
        check(
          document.documentElement.hasAttribute("data-bgg-hard-blocker-ready"),
          "page remained hidden after the 500 ms post-load ceiling"
        );
        check(getComputedStyle(document.body).visibility === "visible", "page is not visible after the ceiling");

        document.body.dataset.status = failures.length ? "fail" : "pass";
        document.body.dataset.report = JSON.stringify({ failures, earlyState });
      }, 650);
    </script>
  </body>
</html>
