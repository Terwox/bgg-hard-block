<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>CSS attachment failsafe test</title>
    <link rel="stylesheet" href="../src/content.css">
  </head>
  <body data-status="running">
    <p>Content must reveal even when the content script never attaches.</p>
    <script>
      const failures = [];
      const check = (condition, message) => { if (!condition) failures.push(message); };

      window.setTimeout(() => {
        const body = getComputedStyle(document.body);
        check(body.opacity === "0", "pre-attachment hold did not hide the page");
        check(body.pointerEvents === "none", "pre-attachment hold left the page clickable");
      }, 100);

      window.setTimeout(() => {
        const body = getComputedStyle(document.body);
        check(body.opacity === "1", "two-second CSS failsafe did not reveal the page");
        check(body.pointerEvents === "auto", "two-second CSS failsafe left the page unclickable");
        check(body.visibility === "visible", "two-second CSS failsafe left the page invisible");
        document.body.dataset.status = failures.length ? "fail" : "pass";
        document.body.dataset.report = JSON.stringify({ failures });
      }, 2200);
    </script>
  </body>
</html>
