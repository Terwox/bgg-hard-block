<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Content runtime test</title>
    <link rel="stylesheet" href="../src/content.css">
    <script>
      const writes = [];
      globalThis.chrome = {
        runtime: {
          async sendMessage(message) {
            if (message?.type === "bgg-hard-blocker:update-content-status:v1") {
              writes.push(message);
              return { status: "ok" };
            }
            return {
              status: "ready",
              usernames: ["Muted User"],
              unresolvedCount: 0,
              syncedAt: "2026-08-04T00:00:00.000Z"
            };
          }
        },
        storage: {
          local: {
            async get() {
              return {
                bggHardBlockerConsent: {
                  granted: true,
                  disclosureVersion: "2026-08-15"
                },
                bggHardBlockerState: {
                  schemaVersion: 2,
                  usernames: ["Muted User"],
                  avatarIds: [],
                  status: { lastSync: "2026-08-04T00:00:00.000Z" }
                }
              };
            },
            async set(value) {
              writes.push(value);
            }
          }
        }
      };
    </script>
    <script src="../src/content-core.js"></script>
    <script src="../src/content.js"></script>
    <script src="../src/content-core.js"></script>
    <script src="../src/content.js"></script>
  </head>
  <body data-status="running">
    <gg-post id="runtime-placeholder">
      <article class="post">
        <div class="post-body"><span>Blocked User</span><button>Show Anyway</button></div>
      </article>
    </gg-post>
    <gg-post id="runtime-reply">
      <article class="post">
        <header class="post-header"><a href="/profile/Allowed">Allowed</a></header>
        <div class="post-body">
          <gg-markup-quote id="runtime-blocked-quote">
            <div class="c-header"><span class="user-attribution">Muted User<br>@Muted User</span></div>
            <gg-markup-content>Blocked content</gg-markup-content>
          </gg-markup-quote>
          <p id="runtime-reply-text">Still here</p>
        </div>
      </article>
    </gg-post>
    <gg-post id="runtime-quote-source">
      <article class="post">
        <header class="post-header"><a href="/profile/Allowed%20Reply">Allowed Reply</a></header>
        <div class="post-body">Visible allowed reply</div>
        <button id="runtime-quote-button" type="button" class="post-btn"> Quote </button>
      </article>
    </gg-post>
    <gg-thread-listing id="runtime-forum-row">
      <span id="runtime-blocked-name-slot">
        <gg-avatar-popup-trigger>
          <div container="body" triggers="manual" autoclose="outside">
            <a href="/profile/Muted%20User" target="_self">
              <span>Muted User</span>
            </a>
          </div>
        </gg-avatar-popup-trigger>
      </span>
      <a id="runtime-allowed-name" href="/profile/AllowedUser" target="_self">
        <span>AllowedUser</span>
      </a>
    </gg-thread-listing>
    <div id="runtime-composer"></div>
    <script>
      const rawQuoteDraft = `[q="Allowed Reply"]
[q="Muted User"][q="Earlier User"]Earlier quotation[/q]
Blocked user's words.[/q]
Allowed reply survives.
[q="Someone Else"]Allowed sibling quotation.[/q]
[/q]
`;
      const expectedQuoteDraft = `[q="Allowed Reply"]

Allowed reply survives.
[q="Someone Else"]Allowed sibling quotation.[/q]
[/q]
`;
      let quoteEditorInputEvents = 0;

      document.getElementById("runtime-quote-button").addEventListener("click", () => {
        setTimeout(() => {
          const textarea = document.createElement("textarea");
          textarea.id = "runtime-quote-editor";
          textarea.name = "text";
          textarea.className = "post-textarea";
          textarea.value = rawQuoteDraft;
          textarea.addEventListener("input", () => {
            quoteEditorInputEvents += 1;
          });
          document.getElementById("runtime-composer").append(textarea);
        }, 0);
      });

      setTimeout(() => document.getElementById("runtime-quote-button").click(), 25);

      setTimeout(() => {
        const failures = [];
        const check = (condition, message) => {
          if (!condition) failures.push(message);
        };

        check(document.documentElement.hasAttribute("data-bgg-hard-blocker-ready"), "page was not revealed");
        check(!document.getElementById("runtime-placeholder"), "placeholder survived runtime filtering");
        check(!document.getElementById("runtime-blocked-quote"), "blocked quote survived runtime filtering");
        check(Boolean(document.getElementById("runtime-reply-text")), "reply text was removed");
        const blockedName = document.querySelector(
          "#runtime-blocked-name-slot [data-bgg-hard-blocker-redacted]"
        );
        check(blockedName?.textContent.trim() === "Blocked", "forum-list username was not redacted");
        check(blockedName?.tagName === "SPAN", "forum-list username did not become plain text");
        check(!blockedName?.hasAttribute("href"), "redacted username still links to the profile");
        check(
          !blockedName?.closest("gg-avatar-popup-trigger"),
          "redacted username retained BGG's hover popup"
        );
        check(
          document.getElementById("runtime-allowed-name")?.textContent.trim() === "AllowedUser",
          "allowed forum-list username was changed"
        );
        check(writes.length > 0, "runtime status was not written");
        const status = writes.at(-1)?.status;
        check(
          !Object.hasOwn(status || {}, "pageUrl"),
          "runtime status retained the discussion URL"
        );
        check(
          ["blockedCount", "lastSync", "source", "unresolved"].every(
            (key) => !Object.hasOwn(status || {}, key)
          ),
          "runtime status included background-owned canonical metadata"
        );
        check(status?.hiddenPosts === 1, `expected 1 hidden post, got ${status?.hiddenPosts}`);
        check(status?.hiddenQuotes === 1, `expected 1 hidden quote, got ${status?.hiddenQuotes}`);
        check(
          status?.redactedProfileNames === 1,
          `expected 1 redacted name, got ${status?.redactedProfileNames}`
        );
        const quoteEditor = document.getElementById("runtime-quote-editor");
        check(Boolean(quoteEditor), "BGG-style quote editor was not created");
        check(
          quoteEditor?.value === expectedQuoteDraft,
          `blocked quote returned in composer: ${JSON.stringify(quoteEditor?.value)}`
        );
        check(quoteEditorInputEvents === 1, "sanitized quote did not update the editor model once");

        document.body.dataset.status = failures.length ? "fail" : "pass";
        document.body.dataset.report = JSON.stringify({
          failures,
          statusMessage: writes.at(-1)
        });
      }, 650);
    </script>
  </body>
</html>
