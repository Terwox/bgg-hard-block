<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Private authorization capture bridge test</title>
    <script>
      const pageCalls = [];
      const storageCalls = [];
      const consoleCalls = [];
      const runtimeErrors = [];
      const hostilePageResponse = {
        status: "error",
        authorization: "attacker-controlled",
        usernames: ["Page-Owned Fake"],
        profileCache: { 42: { username: "Page-Owned Fake" } },
        subscriptionLinking: { state: "synced" }
      };

      const originalFetch = async (input, init = {}) => {
        const url = String(input instanceof Request ? input.url : input);
        const method = String(init.method || input?.method || "GET").toUpperCase();
        pageCalls.push({ url, method });
        return new Response(JSON.stringify(hostilePageResponse), {
          status: 200,
          headers: { "Content-Type": "application/json" }
        });
      };
      window.fetch = originalFetch;

      globalThis.chrome = {
        storage: {
          local: {
            get(...args) {
              storageCalls.push({ operation: "get", args });
              return Promise.resolve({});
            },
            set(...args) {
              storageCalls.push({ operation: "set", args });
              return Promise.resolve();
            }
          }
        }
      };

      for (const method of ["log", "warn", "error"]) {
        const original = console[method].bind(console);
        console[method] = (...args) => {
          consoleCalls.push({ method, args: args.map(String) });
          original(...args);
        };
      }
      addEventListener("error", (event) => runtimeErrors.push(event.message));
      addEventListener("unhandledrejection", (event) => runtimeErrors.push(String(event.reason)));
    </script>
    <script src="../src/page-bridge.js"></script>
  </head>
  <body data-status="running">
    <p id="page-content">Page-owned content</p>
    <script>
      const failures = [];
      const check = (condition, message) => {
        if (!condition) failures.push(message);
      };
      const originalXhrOpen = XMLHttpRequest.prototype.open;
      const originalXhrSetRequestHeader = XMLHttpRequest.prototype.setRequestHeader;
      const authorization = ["GeekAuth ", "private", "-capture-token"].join("");

      (async () => {
        const resultPromise = installBggBlockListBridge({
          allowFileFixture: true,
          channelNonce: "b".repeat(32),
          linkSubscriptionBlocks: true,
          profileCache: hostilePageResponse.profileCache
        });
        const response = await fetch("https://api.geekdo.com/api/thread/123", {
          headers: { Authorization: authorization }
        });
        const pageResult = await response.json();
        const result = await resultPromise;

        check(
          JSON.stringify(Object.keys(result).sort()) ===
            JSON.stringify(["authorization", "status"]),
          `private result exposed unexpected fields: ${JSON.stringify(result)}`
        );
        check(result.status === "ready", "bridge did not report captured authorization as ready");
        check(pageResult.status === "error", "bridge changed the page-owned response status");
        check(result.authorization === authorization, "bridge changed the captured authorization");
        check(
          pageResult.usernames?.[0] === "Page-Owned Fake",
          "bridge changed the page's own fetch response"
        );
        check(pageCalls.length === 1, `bridge performed extra API work (${pageCalls.length} calls)`);
        check(pageCalls[0]?.method === "GET", "bridge induced a write request");
        check(storageCalls.length === 0, "MAIN-world bridge accessed extension storage");
        check(!document.documentElement.outerHTML.includes(authorization), "authorization entered the DOM");
        check(!JSON.stringify(storageCalls).includes(authorization), "authorization entered storage calls");
        check(!JSON.stringify(consoleCalls).includes(authorization), "authorization entered console output");
        check(!JSON.stringify(runtimeErrors).includes(authorization), "authorization entered an error");
        check(!document.querySelector('[id^="bgg-hard-blocker-data"]'), "bridge published a DOM payload");

        globalThis.__bggHardBlockerStop();
        check(window.fetch === originalFetch, "stop did not restore the exact fetch function");
        check(
          XMLHttpRequest.prototype.open === originalXhrOpen,
          "stop did not restore the exact XMLHttpRequest.open function"
        );
        check(
          XMLHttpRequest.prototype.setRequestHeader === originalXhrSetRequestHeader,
          "stop did not restore the exact XMLHttpRequest.setRequestHeader function"
        );

        document.body.dataset.status = failures.length ? "fail" : "pass";
        document.body.dataset.report = JSON.stringify({
          failures,
          resultKeys: Object.keys(result).sort(),
          pageCallCount: pageCalls.length,
          storageCallCount: storageCalls.length
        });
      })().catch((error) => {
        document.body.dataset.status = "fail";
        document.body.dataset.report = JSON.stringify({
          failures: [...failures, error?.stack || String(error)]
        });
      });
    </script>
  </body>
</html>
